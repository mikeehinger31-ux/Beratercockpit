[build]
  command = "LATEST_ZIP=$(git log --name-only --format='' | grep '\\.zip$' | head -n 1); if [ -z \"$LATEST_ZIP\" ]; then LATEST_ZIP=$(ls -t *.zip | head -n 1); fi; rm -rf public && mkdir public && unzip -o \"$LATEST_ZIP\" -d public && if [ $(ls -1 public | wc -l) -eq 1 ] && [ -d public/$(ls -1 public) ]; then mv public/$(ls -1 public)/* public/ && rmdir public/$(ls -1 public); fi"
  publish = "public"
