[build]
  command = "rm -rf public && mkdir public && LATEST_ZIP=$(git log --name-only --pretty=format:'' -n 10 | grep '\\.zip$' | head -n 1) && unzip -o \"$LATEST_ZIP\" -d public && if [ $(ls -1 public | wc -l) -eq 1 ] && [ -d public/$(ls -1 public) ]; then mv public/$(ls -1 public)/* public/ && rmdir public/$(ls -1 public); fi"
  publish = "public"
